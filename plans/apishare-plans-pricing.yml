description: >-
  ApiShare publishes two named subscription plans and the axis they are priced
  on, but no prices. The pricing driver is the TOTAL NUMBER OF DIGITAL PRODUCTS
  AND ASSETS in a single subscription, sold in incremental bands of
  250 / 500 / 1000 / 1500 / TOP. No currency figure, per-band price, or billing
  period appears anywhere on the pricing page — every tier routes to "Talk to an
  expert" or "Request a trial". Add-ons and a two-level Success Journey
  (Standard / Premiere) are sold on top and are marked "Required, priced
  separately" where applicable. Plan CONTENT below is verbatim from the page;
  nothing is inferred.
plan_count: 2
pricing_model: quote-only (named tiers, published pricing driver, no published prices)
pricing_driver:
  metric: total number of digital Products and Assets for a single subscription
  bands: ['250', '500', '1000', '1500', 'TOP']
  style: incremental
billing_period: not published
currency: not published
trial:
  available: true
  self_serve: false
  note: >-
    "If you want to explore the platform through a trial and understand which
    tier best fits your scenario, talk to our team." — Request a trial is a
    contact form, not a self-serve signup.
promotion:
  name: API Governance Maturity Assessment + ApiShare FREE License
  note: Site-wide promo banner on the pricing page; terms are not published.
