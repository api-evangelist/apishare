x-coverage:
  state: covered
  reason: no-machine-readable-spec
  detail: >-
    ApiShare sells API governance software and publishes a full, server-rendered
    product documentation set, a dated release-note page and a two-tier pricing
    page — but it operates no public API of its own: no developer portal, no API
    reference, no OpenAPI/AsyncAPI/GraphQL contract, no SDK in any registry, and
    every /.well-known/ path 404s on www.apishare.cloud while api.apishare.cloud
    (a Kong gateway) answers a blanket anonymous 403 to every request including a
    negative control.
  evidence:
    - url: https://www.apishare.cloud/documentation-2.1
      status: 200
    - url: https://www.apishare.cloud/.well-known/api-catalog
      status: 404
    - url: https://api.apishare.cloud/openapi.json
      status: 403
    - url: https://www.apishare.cloud/llms.txt
      status: 404
