  - version: 2.1.0
    date: '2026-07'
    latest: true
    breaking: []
    additions:
      - Automated user onboarding — a single invocation orchestrates entity creation and user access management, including deactivation, for integration with external identity systems and CI/CD pipelines
      - Page Visibility Configuration — tenant admins define which frontend sections and cards are available by organization type, user role and guest scenario
      - Catalog and Workspace filter configuration, centrally managed per user type
    highlights:
      - Discovery Expert consolidated for robustness and maintainability
      - Invitations and Join Requests gained sorting, informational columns and SSO-facing unique identifier display
      - Subscriptions accept multiple IP addresses and CIDR ranges in one request
      - Notifications section under Administration redesigned
      - Multiple security remediations applied following vulnerability assessment activities
  - version: 2.0.0
    date: '2026-04'
    breaking: []
    additions:
      - AI Experts — Discovery Expert (natural-language exploration of the digital product catalog) and Design Expert (governance-aware design guidance)
      - AI-assisted API Designer for OpenAPI with Create / Fix / Enrich, API specification templates, and configurable validation and linting
      - Automated digital product lifecycle and versioning utilities aimed at CI/CD integration
      - API specification reload — republish a spec without a full gateway republish for non-breaking changes
    highlights:
      - Policy templates extended with new logical operators including CONTAINS ANY
      - Multi-level navigation, breadcrumbs, advanced search with sorting and filtering
  - version: 1.12.0
    date: '2025-12'
    breaking: []
    additions:
      - Automated subscription approval with optional Business Owner and IT Owner approval steps
      - System Settings — a centralized platform configuration area (tenant information, documentation management, SMTP, system properties)
      - Homepage widget permissions by role
    highlights:
      - Administration UX redesign
      - IP-based filtering fields on subscriptions, applied to gateway-level filtering rules on activation
      - Subscription detail view shows organization type of consuming application and API provider
  - version: 1.11.0
    date: '2025-10'
    breaking: []
    additions:
      - Cross-organizational roles spanning multiple organizations within a tenant
