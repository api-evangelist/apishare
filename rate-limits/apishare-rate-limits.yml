description: >-
  ApiShare publishes no rate limits. It has no public API contract and no
  developer reference, so there is no documented request ceiling, window, burst
  allowance, exhaustion status code, or rate-limit response header anywhere on
  its site or in its 2.1 documentation set. The only published consumption axis
  is commercial, not runtime: subscriptions are sized by the total number of
  digital products and assets in incremental bands (250 / 500 / 1000 / 1500 /
  TOP) — that is a catalog-size band, not a request rate. An honest zero.
limit_count: 0
headers: {}
limits: []
exhaustion:
  status_code: null
  retry_after: false
notes:
  - >-
    Rate limiting IS a product capability ApiShare governs on behalf of its
    customers — the platform configures gateway-level policies (including
    IP-based filtering rules applied on subscription activation, release 1.12)
    on Boomi, Red Hat 3scale, Azure API Management and Kong. Those limits belong
    to the customer's gateway, not to an ApiShare API.
  - >-
    api.apishare.cloud resolves to a Kong gateway and returns a blanket
    anonymous 403, so no live rate-limit header could be observed either.
