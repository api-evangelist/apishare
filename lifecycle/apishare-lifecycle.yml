description: >-
  ApiShare is a governance platform, not a public API provider. What it versions
  and supports publicly is the PRODUCT, not an API contract — there is no public
  API reference, no dated API version header, and no machine-readable spec. The
  lifecycle signals below are the ones ApiShare actually publishes: a numbered
  product release line, a documentation version selector that names which
  releases are still supported, and a support tier attached to the commercial
  plans.
